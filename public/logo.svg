<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Musical note with tabla-inspired design -->
    <defs>
        <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Note stem -->
    <rect x="68" y="15" width="6" height="50" fill="url(#noteGradient)" rx="3"/>

    <!-- Note head (eighth note style) -->
    <ellipse cx="62" cy="65" rx="18" ry="14" fill="url(#noteGradient)" transform="rotate(-25 62 65)"/>

    <!-- Flag (single eighth note flag) -->
    <path d="M 74 15 Q 90 20, 88 35 Q 86 45, 74 42" fill="url(#noteGradient)"/>

    <!-- Accent dots (inspired by tabla bols) -->
    <circle cx="30" cy="45" r="4" fill="url(#noteGradient)" opacity="0.8"/>
    <circle cx="20" cy="60" r="3.5" fill="url(#noteGradient)" opacity="0.7"/>
    <circle cx="35" cy="70" r="3" fill="url(#noteGradient)" opacity="0.6"/>
</svg>